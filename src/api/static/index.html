<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Farmaceutico</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png?v=1">
    <link rel="apple-touch-icon" href="/static/logo.png?v=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- ==================== LOGIN VIEW ==================== -->
    <div id="login-view" class="login-view">
        <div class="login-card">
            <img class="login-logo" src="/static/logo.png?v=1" alt="Logo do sistema">
            <h1 class="login-title">RAG Farmaceutico</h1>
            <p class="login-subtitle">Sistema de Suporte a Decisao Farmaceutica</p>
            <form id="loginForm" class="login-form" autocomplete="on">
                <div class="login-field">
                    <label for="loginUsername">Utilizador</label>
                    <input type="text" id="loginUsername" name="username" required autofocus
                           autocomplete="username">
                </div>
                <div class="login-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
                <div class="login-error" id="loginError" hidden></div>
            </form>
            <div class="login-footer">UTAD &middot; 2025/2026</div>
        </div>
    </div>

    <!-- ==================== APP VIEW ==================== -->
    <div id="app-view" class="app-view" hidden>
        <header class="header">
            <div class="header-left">
                <img class="header-logo" src="/static/logo.png?v=1" alt="Logo do sistema">
                <div>
                    <h1>RAG Farmaceutico</h1>
                    <span class="header-subtitle">Sistema de Suporte a Decisao Farmaceutica</span>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">A verificar...</span>
                </div>
                <div class="user-chip">
                    <div class="user-info">
                        <span class="user-name" id="userName">-</span>
                        <span class="user-role" id="userRole">-</span>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Terminar sessao">Sair</button>
                </div>
            </div>
        </header>

        <nav class="tabs-bar" id="tabsBar"></nav>

        <main id="contentArea"></main>

        <div class="footer">
            Sistema RAG para Suporte a Decisao Farmaceutica &middot; UTAD 2025/2026
            <br>
            <a href="/docs" target="_blank">Documentacao da API (Swagger)</a>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>

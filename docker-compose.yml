services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Ollama corre fora do Docker (no host); host.docker.internal e como os
      # containers do Docker Desktop alcancam servicos do host. Tem precedencia
      # sobre o OLLAMA_HOST=localhost do .env (load_dotenv sem override).
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
